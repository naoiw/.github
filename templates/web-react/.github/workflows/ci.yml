name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-check:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@main
    with:
      package-manager: npm
      node-version: "26"
      run-lint: true
      run-typecheck: true
      run-tests: false
      run-build: true
