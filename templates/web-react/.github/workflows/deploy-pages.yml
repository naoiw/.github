name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: naoiw/.github/.github/workflows/reusable-vite-pages.yml@495524d0ef4b8418566782a569de6c34a9d63ce2
    with:
      package-manager: npm
      node-version: "26"
      publish-preview: false
