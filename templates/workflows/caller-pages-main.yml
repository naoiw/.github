name: Deploy Pages (main only)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: naoiw/.github/.github/workflows/reusable-vite-pages.yml@2803c2939d96544d9243244686dad8e58b7b78b6
    with:
      package-manager: npm
      node-version: "26"
      publish-preview: false

# Example only. Copy to the target repository's .github/workflows directory.
# Set repository Settings > Pages > Build and deployment: GitHub Actions.
# Reusable workflow ref is pinned. Update the SHA only after integration verification.
