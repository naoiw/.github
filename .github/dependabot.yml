version: 2
updates:
  # Only routine minor/patch updates are grouped. Major updates get separate PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:42"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dependabot uses the npm ecosystem for pnpm package.json/pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/templates/web-react"
    schedule:
      interval: "monthly"
      time: "03:42"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      react-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
