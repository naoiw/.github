name: Validate shared standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML and required files
        run: ruby scripts/check_shared_config.rb
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Test safe AI rule synchronization
        run: node --test scripts/test-sync-agent-rules.mjs
      - name: Build and lint React/Vite starter
        working-directory: templates/web-react
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run lint
          npm run typecheck
          npm run build
