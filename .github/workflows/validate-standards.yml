name: Validate shared standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate YAML and required files
        run: ruby scripts/check_shared_config.rb
      - uses: pnpm/action-setup@v6
        with:
          version: "9.14.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Test safe AI rule synchronization
        run: node --test scripts/test-sync-agent-rules.mjs
      - name: Test repository audit classification
        run: node --test scripts/test-audit-repositories.mjs
      - name: Validate workflow recommendation manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('versions/workflows.json')); if(!/^[a-f0-9]{40}$/.test(m.recommended_commit)) process.exit(1)"
      - name: Test standalone template exporter
        run: node --test scripts/test-export-web-template.mjs
      - name: Build and lint React/Vite starter
        working-directory: templates/web-react
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm lint
          pnpm typecheck
          pnpm build
