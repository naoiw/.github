name: Regenerate pnpm lockfile (temporary)

on:
  push:
    branches: [dependabot/npm_and_yarn/templates/web-react/react-starter-fc80699f9d]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "9.14.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Regenerate pinned pnpm lockfile
        working-directory: templates/web-react
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/web-react/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pnpm lockfile for compatible dependency updates"
            git push origin "HEAD:dependabot/npm_and_yarn/templates/web-react/react-starter-fc80699f9d"
          fi
